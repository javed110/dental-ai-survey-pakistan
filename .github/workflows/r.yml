name: Aggregate research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed aggregate values and data exclusion
        run: python tests/check_public_release.py
      - uses: r-lib/actions/setup-r@f57f1301a053485946083d7a45022b278929a78a
        with:
          r-version: release
      - name: Parse research R scripts
        run: Rscript -e 'files <- list.files(pattern="[.]R$"); invisible(lapply(files, parse)); cat("Parsed", length(files), "R scripts\n")'
